<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Test Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <h1 class="text-center">Our Menu</h1>
            <div class="col-12 col-lg-6">
                <div class="col-12 col-lg-6">
                    <div class="card">
                      <img src="/falafel-img.jpeg" class="img-fluid" alt="sample-image">
                        <div class="card-body">
                         <h2 class="card-title">Falafel</h2>
                        <p>Chickpea, Herbs.</p>
                         </div>
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="card">
                         <img src="/pasta-salad.jpeg" class="img-fluid" alt="sample-image">
                         <div class="card-body">
                            <h2 class="card-title">Pasta Salad</h2>
                            <p>Lettuce, Vegetables and Mozarrella.</p>
                         </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-6">
                <h1>Prices</h1>
                <table class="table">
                    <tr>
                        <td>Falafel</td>
                        <td>$5.00</td>
                    </tr>
                    <tr>
                        <td>Pasta Salad</td>
                        <td>$5.00</td>
                    </tr>   
                </table>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <div class="alert alert-primary" role="alert">
                    Welcome to our restaurant!

                </div>
            </div>
        </div>
    </div>
    

    </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
