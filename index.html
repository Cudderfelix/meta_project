<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Test Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1 class="text-center display-4">Our Menu</h1>
                <div class="row">
                    <div class="col-12 col-lg-6 mb-3">
                        <div class="card">
                            <img src="/falafel-img.jpeg" class="card-img-top" alt="falafel-img">
                            <div class="card-body">
                                <h2 class="card-title">Falafel</h2>
                                <p class="card-text">Chickpea, Herbs.</p>
                            </div>
                        </div>
                    </div>
                 <div class="col-12 col-lg-6 mb-3">
                    <div class="card">
                        <img src="/fried-calamari.jpeg" class="card-img-top" alt="fried-calamari">
                        <div class="card-body">
                            <h2 class="card-title">Fried Calamari <span class="badge bg-primary">New</span></h2>
                            <p class="card-text">Squid, Buttermilk</p>
                        </div>
                    </div>
                  </div>
                    <div class="col-12 col-lg-6 mb-3">
                        <div class="card">
                                 <img src="/pasta-salad.jpeg" class="card-img-top" alt="pasta-salad">
                            <div class="card-body">
                                <h2 class="card-title">Pasta Salad</h2>
                             <p class="card-text">Lettuce, Vegetables and Mozarrella.</p>
                            </div>
                        </div>
                    </div>
               
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <h1>Prices</h1>
                <table class="table">
                    <tr>
                        <td>Fried Calamari</td>
                        <td>$8.00</td>
                    </tr>
                    <tr>
                        <td>Falafel</td>
                        <td>$5.00</td>
                    </tr>
                    <tr>
                        <td>Pasta Salad</td>
                        <td>$5.00</td>
                    </tr>   
                </table>
            </div>
        </div>
       
    </div>
    <div class="container text-center">
         <div class="row">
            <div class="col-12">
                <div class="alert alert-info" role="alert text-center">
                    Try out our new dish: Fried Calamari!

                </div>
            </div>
        </div> 
    </div>  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
